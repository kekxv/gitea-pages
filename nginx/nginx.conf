# Gitea Pages Nginx configuration. The Pages-domain placeholder is replaced at
# build time with an escaped, validated PAGES_DOMAIN value.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    client_body_temp_path /var/cache/nginx/client_temp 1 2;
    proxy_temp_path /var/cache/nginx/proxy_temp 1 2;
    fastcgi_temp_path /var/cache/nginx/fastcgi_temp 1 2;
    uwsgi_temp_path /var/cache/nginx/uwsgi_temp 1 2;
    scgi_temp_path /var/cache/nginx/scgi_temp 1 2;
    proxy_cache_path /var/cache/nginx/proxy_cache levels=1:2 keys_zone=pages:10m inactive=1h;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    disable_symlinks on;
    autoindex off;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Bound webhook bursts before they reach the deployer.  The endpoint below
    # is the only externally reachable route that accepts webhook payloads.
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=10r/s;

    upstream deployer {
        server deployer:8080;
    }

    # Reject every Host that is not an exact configured Pages hostname.
    server {
        listen 8080 default_server;
        server_name _;
        return 421;
    }

    # DOMAIN is the complete Pages domain (for example, pages.example.com).
    # Usernames are deliberately constrained to deployment IDs.
    server {
        listen 8080;
        server_name "~^(?<username>[a-z0-9][a-z0-9-]{0,62})\.__PAGES_DOMAIN_REGEX__$";

        root /var/www/pages/$username;

        location ~ ^/_root(/|$) {
            return 403;
        }

        location ~ ^/\.git(/|$) {
            return 403;
        }

        location ~ /\. {
            return 403;
        }

        location = / {
            try_files /_root/index.html =404;
        }

        location / {
            try_files $uri $uri/ /_root$uri /_root$uri/ =404;
        }

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # The Pages control plane is the exact configured Pages domain.
    server {
        listen 8080;
        server_name __PAGES_DOMAIN_LITERAL__;

        location = /webhook {
            if ($request_method != POST) {
                return 405;
            }

            client_max_body_size 1m;
            limit_req zone=webhook burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://deployer;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://deployer;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 127.0.0.1:8081;
        server_name localhost;

        location = /health {
            default_type text/plain;
            return 200 "OK\n";
        }
    }
}
