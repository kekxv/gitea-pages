# Production topology: only Nginx publishes a host port. Deployer is reachable
# through the explicit pages.<DOMAIN> Nginx virtual host on the private network.
services:
  nginx:
    build:
      context: ./nginx
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
        PAGES_DOMAIN: ${DOMAIN:?DOMAIN must be set to the Pages parent domain}
    container_name: gitea-pages-nginx
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${HTTP_PORT:-80}:8080"
    volumes:
      - pages_data:/var/www/pages:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    cpus: "0.50"
    mem_limit: 128M
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,uid=1000,gid=1000,mode=700
      - /var/cache/nginx:rw,nosuid,nodev,noexec,uid=1000,gid=1000,mode=700
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      deployer:
        condition: service_started
    networks:
      - pages_frontend
      - pages_backend

  deployer:
    build:
      context: ./deployer
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    container_name: gitea-pages-deployer
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    expose:
      - "8080"
    volumes:
      - pages_data:/var/www/pages:rw
      - deployer_data:/var/lib/deployer:rw
    secrets:
      - source: session_secret
        target: gitea_pages_session_secret
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: token_encryption_key
        target: gitea_pages_token_encryption_key
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: oauth_client_secret
        target: gitea_pages_oauth_client_secret
        uid: "1000"
        gid: "1000"
        mode: 0400
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set to the Pages parent domain}
      APP_ENV: ${APP_ENV:-production}
      WEBHOOK_PORT: "8080"
      PAGES_DATA_DIR: /var/www/pages
      DEPLOYER_DATA_DIR: /var/lib/deployer
      SESSION_SECRET_FILE: /run/secrets/gitea_pages_session_secret
      TOKEN_ENCRYPTION_KEY_FILE: /run/secrets/gitea_pages_token_encryption_key
      OAUTH_CLIENT_SECRET_FILE: /run/secrets/gitea_pages_oauth_client_secret
      GITEA_API_URL: ${GITEA_API_URL:?GITEA_API_URL must be set}
      GITEA_PUBLIC_URL: ${GITEA_PUBLIC_URL:?GITEA_PUBLIC_URL must be set}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:?OAUTH_CLIENT_ID must be set}
      OAUTH_REDIRECT_URL: https://pages.${DOMAIN:?DOMAIN must be set to the Pages parent domain}/oauth/callback
      WEBHOOK_PUBLIC_URL: https://pages.${DOMAIN:?DOMAIN must be set to the Pages parent domain}/webhook
      MAX_SITE_SIZE_MB: ${MAX_SITE_SIZE_MB:-100}
      MAX_REPOSITORY_SIZE_MB: ${MAX_REPOSITORY_SIZE_MB:-1024}
      MAX_CONCURRENT_DEPLOYS: ${MAX_CONCURRENT_DEPLOYS:-4}
      CLONE_TIMEOUT: ${CLONE_TIMEOUT:-1m}
      ACQUIRE_TIMEOUT: ${ACQUIRE_TIMEOUT:-30s}
      ENABLE_ORGANIZATION_HOOKS: ${ENABLE_ORGANIZATION_HOOKS:-true}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    cpus: "1.00"
    mem_limit: 512M
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,uid=1000,gid=1000,mode=700,size=256m
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - pages_backend
      - deployer_egress

volumes:
  pages_data:
    name: gitea-pages-data
    driver_opts:
      type: none
      o: bind
      device: ${PAGES_DATA_DIR:-/data/gitea-pages}
  deployer_data:
    name: gitea-pages-deployer-data

secrets:
  session_secret:
    file: ${SESSION_SECRET_HOST_FILE:?SESSION_SECRET_HOST_FILE must name a readable secret file}
  token_encryption_key:
    file: ${TOKEN_ENCRYPTION_KEY_HOST_FILE:?TOKEN_ENCRYPTION_KEY_HOST_FILE must name a readable secret file}
  oauth_client_secret:
    file: ${OAUTH_CLIENT_SECRET_HOST_FILE:?OAUTH_CLIENT_SECRET_HOST_FILE must name a readable secret file}

networks:
  pages_frontend:
    name: gitea-pages-frontend
    driver: bridge
  pages_backend:
    name: gitea-pages-backend
    driver: bridge
    internal: true
  deployer_egress:
    name: gitea-pages-deployer-egress
    driver: bridge
