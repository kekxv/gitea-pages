# Gitea Pages Docker Compose
# Security-hardened deployment with non-root containers

services:
  # Nginx - Static file server (read-only access to pages)
  nginx:
    build:
      context: ./nginx
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    container_name: gitea-pages-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - pages_data:/var/www/pages:ro
      - certs_data:/etc/letsencrypt:ro
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/run/nginx:size=10M,mode=755
      - /var/cache/nginx:size=50M,mode=755
      - /var/log/nginx:size=10M,mode=755
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - pages_network
    depends_on:
      - deployer

  # Deployer - Webhook handler (write access to pages)
  deployer:
    build:
      context: ./deployer
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    container_name: gitea-pages-deployer
    restart: unless-stopped
    ports:
      - "${WEBHOOK_PORT:-8080}:8080"
    volumes:
      - pages_data:/var/www/pages:rw
      - deployer_data:/var/lib/deployer:rw
      - ${SESSION_SECRET_HOST_FILE:-/dev/null}:/run/secrets/gitea_pages_session_secret:ro
      - ${TOKEN_ENCRYPTION_KEY_HOST_FILE:-/dev/null}:/run/secrets/gitea_pages_token_encryption_key:ro
      - ${OAUTH_CLIENT_SECRET_HOST_FILE:-/dev/null}:/run/secrets/gitea_pages_oauth_client_secret:ro
      - ${LEGACY_WEBHOOK_SECRET_HOST_FILE:-/dev/null}:/run/secrets/gitea_pages_legacy_webhook_secret:ro
    environment:
      - DOMAIN=${DOMAIN:-yourdomain.com}
      - APP_ENV=${APP_ENV:-production}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - LEGACY_WEBHOOK_SECRET_FILE=${LEGACY_WEBHOOK_SECRET_HOST_FILE:+/run/secrets/gitea_pages_legacy_webhook_secret}
      - SESSION_SECRET_FILE=${SESSION_SECRET_HOST_FILE:+/run/secrets/gitea_pages_session_secret}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - TOKEN_ENCRYPTION_KEY_FILE=${TOKEN_ENCRYPTION_KEY_HOST_FILE:+/run/secrets/gitea_pages_token_encryption_key}
      - WEBHOOK_PORT=8080
      - PAGES_DATA_DIR=/var/www/pages
      - DEPLOYER_DATA_DIR=/var/lib/deployer
      - ENABLE_HTTPS=${ENABLE_HTTPS:-false}
      - MAX_SITE_SIZE_MB=${MAX_SITE_SIZE_MB:-100}
      - GITEA_ACCESS_TOKEN=${GITEA_ACCESS_TOKEN:-}
      - GITEA_API_URL=${GITEA_API_URL:-}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-}
      - OAUTH_CLIENT_SECRET_FILE=${OAUTH_CLIENT_SECRET_HOST_FILE:+/run/secrets/gitea_pages_oauth_client_secret}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-}
      - OAUTH_REDIRECT_URL=${OAUTH_REDIRECT_URL:-}
      - WEBHOOK_PUBLIC_URL=${WEBHOOK_PUBLIC_URL:-}
      - GITEA_PUBLIC_URL=${GITEA_PUBLIC_URL:-}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - pages_network

  # Certbot - Let's Encrypt certificate management (optional)
  certbot:
    image: certbot/certbot:latest
    container_name: gitea-pages-certbot
    restart: unless-stopped
    profiles:
      - https
    volumes:
      - certs_data:/etc/letsencrypt
      - pages_data:/var/www/pages:ro
    environment:
      - DOMAIN=${DOMAIN:-yourdomain.com}
      - CERT_EMAIL=${CERT_EMAIL:-admin@yourdomain.com}
    entrypoint: /bin/sh
    command: -c "certbot certonly --webroot --webroot-path=/var/www/pages/_certbot -d *.${DOMAIN} --email ${CERT_EMAIL} --agree-tos --no-eff-email --keep-or-renew && crond -f"
    networks:
      - pages_network

volumes:
  pages_data:
    name: gitea-pages-data
    driver_opts:
      type: none
      o: bind
      device: ${PAGES_DATA_DIR:-/data/gitea-pages}
  deployer_data:
    name: gitea-pages-deployer-data
  certs_data:
    name: gitea-pages-certs

networks:
  pages_network:
    name: gitea-pages-network
    driver: bridge
