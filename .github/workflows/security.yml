name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GO_VERSION: "1.26.7"
  GOVULNCHECK_VERSION: "v1.6.0"
  TRIVY_VERSION: "0.73.0"
  REGISTRY: ghcr.io
  DEPLOYER_IMAGE: gitea-pages-deployer
  NGINX_IMAGE: gitea-pages-nginx

jobs:
  verify-and-publish:
    name: Verify and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: deployer/go.sum

      - name: Install govulncheck
        working-directory: deployer
        run: go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}

      - name: Run Go verification
        working-directory: deployer
        run: |
          go vet ./...
          go test -race -coverprofile=coverage.out ./...
          govulncheck ./...

      - name: Validate configuration and documentation gates
        run: |
          docker compose --env-file .env.example config --quiet
          bash tests/security_release_gate_test.sh
          bash tests/compose_security_test.sh
          bash tests/nginx_test.sh

      - name: Build release candidates for image scanning
        run: |
          docker build --tag ${DEPLOYER_IMAGE}:${GITHUB_SHA} ./deployer
          docker build --build-arg PAGES_DOMAIN=example.com --tag ${NGINX_IMAGE}:${GITHUB_SHA} ./nginx

      - name: Install Trivy
        run: |
          curl --fail --location --retry 3 --output /tmp/trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar --extract --gzip --file /tmp/trivy.tar.gz --directory /tmp trivy
          install -m 0755 /tmp/trivy /usr/local/bin/trivy

      - name: Scan configuration and release images
        run: |
          trivy config --exit-code 1 --severity HIGH,CRITICAL .
          trivy image --exit-code 1 --severity CRITICAL ${DEPLOYER_IMAGE}:${GITHUB_SHA}
          trivy image --exit-code 1 --severity CRITICAL ${NGINX_IMAGE}:${GITHUB_SHA}

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login "$REGISTRY" --username "${{ github.actor }}" --password-stdin

      - name: Publish multi-architecture images
        if: github.event_name == 'push'
        env:
          IMAGE_PREFIX: ${{ env.REGISTRY }}/${{ github.repository }}
        run: |
          docker buildx create --name gitea-pages --use || docker buildx use gitea-pages
          deployer_tags="-t ${IMAGE_PREFIX}/deployer:${GITHUB_SHA}"
          nginx_tags="-t ${IMAGE_PREFIX}/nginx:${GITHUB_SHA}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            deployer_tags="$deployer_tags -t ${IMAGE_PREFIX}/deployer:latest"
            nginx_tags="$nginx_tags -t ${IMAGE_PREFIX}/nginx:latest"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            deployer_tags="$deployer_tags -t ${IMAGE_PREFIX}/deployer:${GITHUB_REF_NAME}"
            nginx_tags="$nginx_tags -t ${IMAGE_PREFIX}/nginx:${GITHUB_REF_NAME}"
          fi
          docker buildx build --platform linux/amd64,linux/arm64 --push $deployer_tags ./deployer
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg PAGES_DOMAIN=example.com --push $nginx_tags ./nginx
